server {
    listen 80;
    server_name www.indianpgmanagement.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.indianpgmanagement.com;

    ssl_certificate /etc/letsencrypt/live/www.indianpgmanagement.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.indianpgmanagement.com/privkey.pem;

    # Proxy API requests to the mobile API backend
    location /api/v1/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_backend ipgm-mobapi-prod;
        proxy_pass http://$api_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy everything else to the web UI container
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $web_ui ipgm-web-ui;
        proxy_pass http://$web_ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
