server {
    listen 80;
    server_name admin.indianpgmanagement.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.indianpgmanagement.com;

    ssl_certificate /etc/letsencrypt/live/admin.indianpgmanagement.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.indianpgmanagement.com/privkey.pem;

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $admin_ui ipgm-admin-ui;
        proxy_pass http://$admin_ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
